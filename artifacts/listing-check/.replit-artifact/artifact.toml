kind = "web"
previewPath = "/"
title = "Fakeless"
description = "Fakeless screens resale listing photos for visible warning signs. Includes category checklists, evidence capture, five demos, model-specific comparison where documented references exist, and server-gated mock publishing."
version = "1.0.0"
id = "artifacts/listing-check"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25367

[services.development]
run = "pnpm --filter @workspace/listing-check run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/listing-check", "run", "build" ]
serve = "static"
publicDir = "artifacts/listing-check/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25367"
BASE_PATH = "/"
