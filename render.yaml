# Render Blueprint: one web service (API + built web app) and a free Postgres.
# New > Blueprint > pick this repo, then fill in the secret env vars when asked.
services:
  - type: web
    name: fakeless
    runtime: node
    plan: free
    buildCommand: >-
      corepack enable && pnpm install --frozen-lockfile &&
      PORT=3000 BASE_PATH=/ pnpm --filter @workspace/listing-check run build &&
      pnpm --filter @workspace/api-server run build &&
      pnpm --filter @workspace/db run push
    startCommand: cd artifacts/api-server && node --enable-source-maps ./dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fakeless-db
          property: connectionString
      - key: AI_GATEWAY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
databases:
  - name: fakeless-db
    plan: free
